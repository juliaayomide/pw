<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar CEP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./src/img/map.png" sizes="16x16" type="image/png"> 
</head>
<body>
    <div class="container">
        <div class="box">

            <div class="form-area">
                <h2>Seu endereço</h2>
                <form>
                    <div class="cep-box">
                        <input type="text" id="cep" placeholder="Digite seu CEP" class="input cep-input">
                        <button type="button">Pesquisar</button>
                    </div>
                    <input type="text"  id="endereco" placeholder="Endereço" class="input">
                    <input type="text"  id="bairro" placeholder="Bairro" class="input">
                    <input type="text"  id="cidade" placeholder="Cidade" class="input">
                    <input type="text"  id="uf" placeholder="UF" class="input">
                    <input type="text"  id="ibge" placeholder="Código IBGE" class="input">
                </form>
            </div>

            <div class="image-area">
                <img src="./src/img/7887.jpg" alt="foto">
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
